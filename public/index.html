<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e11d2e">
<meta name="description" content="دستیار هوشمند خرید حضوری در تهران: محصول را پیدا کن، نزدیک‌ترین و ارزان‌ترین فروشگاه را مقایسه کن و از فروشنده بپرس.">
<title>دستیار خرید حضوری | ترب</title>
<link rel="preload" href="fonts/Vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <defs>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M7 5H5v16h14V5h-2M9 12h6M9 16h4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9a3 3 0 0 0 5.3 1.8M9.3 10.8a3 3 0 0 0 5.4 0M14.7 10.8A3 3 0 0 0 20 9M10 20v-5h4v5"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
 </defs>
</svg>

<a class="skip" href="#chat">رفتن به محتوا</a>

<header class="top">
 <div class="top-in">
  <a class="logo" href="./" aria-label="خرید حضوری ترب"><i>ترب</i><span>خرید حضوری</span></a>
  <small class="tag-line">دستیار هوشمند تهران</small>
  <div class="top-act">
   <button class="icon-btn" id="trk" type="button" aria-label="پیگیری پرسش‌ها"><svg class="ic"><use href="#i-clip"/></svg><span class="dot" id="trk-n" hidden></span></button>
   <button class="icon-btn" id="thm" type="button" aria-label="تغییر پوسته روشن/تیره"><svg class="ic"><use href="#i-moon"/></svg></button>
  </div>
 </div>
</header>

<div id="demo" class="demo" hidden>⚠ داده‌های نمایش‌داده‌شده نمونه‌ی Demo هستند، نه اطلاعات واقعی فروشگاه‌ها.</div>
<nav id="crumbs" aria-label="فیلترهای انتخاب‌شده"></nav>
<main id="chat" aria-live="polite"></main>

<form id="composer" class="composer" autocomplete="off">
 <button class="btn ghost sm" id="rs" type="button"><svg class="ic"><use href="#i-refresh"/></svg><span>از نو</span></button>
 <button class="btn ghost sm" id="gp" type="button"><svg class="ic"><use href="#i-target"/></svg><span>موقعیت من</span></button>
 <div class="field">
  <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
  <input id="q" type="text" inputmode="search" enterkeyhint="search" maxlength="200" aria-label="جست‌وجو یا توضیح بده چی لازم داری" placeholder="مثلاً: گوشی سامسونگ آبی تا ۲۵ میلیون">
 </div>
 <button class="btn send" id="sd" type="submit" aria-label="ارسال"><svg class="ic flip"><use href="#i-send"/></svg></button>
</form>

<dialog id="dlg" class="dlg" aria-labelledby="dlg-t">
 <div class="dlg-h"><h2 id="dlg-t"></h2><button class="icon-btn" id="dlg-x" type="button" aria-label="بستن"><svg class="ic"><use href="#i-x"/></svg></button></div>
 <div class="dlg-b" id="dlg-b"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
