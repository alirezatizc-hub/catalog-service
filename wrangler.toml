name = "catalog-service"
main = "worker.js"
compatibility_date = "2026-10-23"
compatibility_flags = ["nodejs_compat"]

# Configure this binding after creating a Hyperdrive connection for the Liara PostgreSQL database.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_LIARA_POSTGRES_HYPERDRIVE_ID"

[observability]
enabled = true
